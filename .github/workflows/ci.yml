name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        working-directory: swift
        run: swift test
      - name: Release app bundle (tests, universal build, icon, codesign)
        run: ./scripts/build.sh --release
