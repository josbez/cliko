name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        working-directory: swift
        run: swift test
      - name: Universal release build
        working-directory: swift
        run: swift build -c release --arch arm64 --arch x86_64
