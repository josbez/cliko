# By hand only (Actions → Release, with a version): build Cliko.dmg on macOS
# and publish a GitHub release with it (the tag is created on the current main
# when it doesn't exist yet). Not on a tag push: the normal release is made on
# the release Mac with the .sig (docs/DEVELOPMENT.md, Making a release), and a
# tag-triggered run would then fail on the release that already exists.
# The release key never leaves the release Mac, so after this workflow the
# .sig is added by hand.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2 (no v)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Build DMG
        run: |
          export VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/make-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Cliko.dmg --target "$GITHUB_SHA" \
            --title "Cliko $VERSION" \
            --notes-file <(awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
