# Push a tag vX.Y, or run it by hand with a version (Actions → Release) →
# build Cliko.dmg on macOS and publish a GitHub release with it (the tag is
# created on the current main when it doesn't exist yet).
# The release key never leaves the release Mac, so the .sig is added by hand
# afterwards (docs/DEVELOPMENT.md, Making a release).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2 (no v)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Build DMG
        run: |
          export VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/make-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Cliko.dmg --target "$GITHUB_SHA" \
            --title "Cliko $VERSION" \
            --notes-file <(awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
